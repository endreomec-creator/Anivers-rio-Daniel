<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de Presença - Aniversário do Daniel</title>
    <style>
        :root {
            --bg-color: #f4efe6;
            --primary-green: #3d5a32;
            --accent-green: #587947;
            --wood-brown: #5c4033;
            --card-bg: #ffffff;
            --text-color: #2c3e2e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            padding: 28px;
            box-sizing: border-box;
            border: 2px solid #e0d6c3;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header span {
            font-size: 0.9rem;
            color: var(--wood-brown);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .header h1 {
            color: var(--primary-green);
            margin: 8px 0 4px 0;
            font-size: 1.8rem;
        }

        .header p {
            color: var(--accent-green);
            margin: 0;
            font-weight: 600;
        }

        .details-box {
            background-color: #f9f6f0;
            border-left: 4px solid var(--primary-green);
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .details-box p {
            margin: 6px 0;
            color: #4a4a4a;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: var(--primary-green);
            font-size: 0.95rem;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            border-color: var(--primary-green);
        }
        
        /* Nova classe para a mensagem de limite */
        .msg-limite {
            font-size: 0.85rem;
            color: var(--accent-green);
            margin-top: 6px;
            font-weight: 600;
            display: none;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--accent-green);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <span>Aventuras no Bosque</span>
        <h1>Daniel - 1 Aninho</h1>
        <p>Venha comemorar conosco!</p>
    </div>

    <div class="details-box">
        <p>📅 <strong>Data:</strong> 26/09/2026</p>
        <p>🕒 <strong>Horário:</strong> 13h às 16h</p>
        <p>📍 <strong>Local:</strong> GameStation - Shopping Patteo L3</p>
    </div>

    <form id="rsvpForm">
        <div class="form-group">
            <label for="nome">Seu Nome Completo:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required autocomplete="off">
            <div id="mensagemLimite" class="msg-limite"></div>
        </div>

        <div class="form-group">
            <label for="presenca">Você irá ao evento?</label>
            <select id="presenca" required>
                <option value="Sim">Sim, estarei lá! 🐾</option>
                <option value="Nao">Infelizmente não poderei ir</option>
            </select>
        </div>

        <div class="form-group" id="groupAcompanhantes">
            <label for="acompanhantes">Quantidade de Pessoas (incluindo você):</label>
            <input type="number" id="acompanhantes" min="1" value="1" required>
        </div>

        <button type="submit" class="btn-submit">Confirmar Presença</button>
    </form>
</div>

<script>
    // Configuração do WhatsApp do Destinatário
    const NUMERO_WHATSAPP = "5581998654686"; 

    // Dicionário com as restrições extraídas da planilha
    const restricoesConvidados = {
        "wilson": 2, "elizangela": 2, "brenda": 2, "maria josé": 3, "eron": 4, 
        "kelly": 4, "malcione": 3, "marlete": 3, "milena": 2, "joão paulo": 2, 
        "abraão": 2, "lucas": 3, "natan": 2, "mateus": 3, "janaina": 2, 
        "lindinho": 1, "leide": 1, "neide": 1, "ester": 1, "bia": 1, 
        "leni": 1, "marida": 1, "marido": 1, "ericka": 1, "emíli": 1, 
        "lidia": 1, "henrique": 1, "esposa": 1, "filho": 1, "ezel": 1, 
        "caio": 1, "jaqueline": 1, "filha": 1, "leninha": 1, "kamila": 1, "kaline": 1
    };

    const inputNome = document.getElementById('nome');
    const inputAcompanhantes = document.getElementById('acompanhantes');
    const mensagemLimite = document.getElementById('mensagemLimite');
    
    // Variável para armazenar o limite detectado (padrão é 1)
    let limiteAtual = 1; 

    // Evento disparado sempre que o usuário digita no campo "Nome"
    inputNome.addEventListener('input', function() {
        const nomeDigitado = this.value.toLowerCase().trim();
        limiteAtual = 1; // Reseta para o limite padrão caso apague o nome
        
        if (nomeDigitado.length > 1) {
            // Ordena os nomes da lista do maior para o menor (Ex: Garante que "João Paulo" seja verificado antes de "João")
            const chaves = Object.keys(restricoesConvidados).sort((a, b) => b.length - a.length);

            for (let chave of chaves) {
                // Checa se o que foi digitado começa igual a algum nome da lista
                if (nomeDigitado.startsWith(chave)) {
                    limiteAtual = restricoesConvidados[chave];
                    break;
                }
            }

            // Exibe a mensagem de limite para orientar o usuário
            mensagemLimite.style.display = 'block';
            mensagemLimite.innerHTML = `🌟 Identificamos limite de até <strong>${limiteAtual} pessoa(s)</strong> para você.`;
        } else {
            mensagemLimite.style.display = 'none';
        }

        // Aplica o limite máximo dinamicamente no campo numérico
        inputAcompanhantes.max = limiteAtual;
        
        // Se a quantidade já inserida for maior que o novo limite, corrige automaticamente
        if (parseInt(inputAcompanhantes.value) > limiteAtual) {
            inputAcompanhantes.value = limiteAtual;
        }
    });

    // Evento de envio do formulário
    document.getElementById('rsvpForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const nome = document.getElementById('nome').value;
        const presenca = document.getElementById('presenca').value;
        const quantidade = parseInt(document.getElementById('acompanhantes').value);

        // Barreira extra de segurança: bloqueia o envio se tentarem burlar o HTML
        if (presenca === "Sim" && quantidade > limiteAtual) {
            alert(`Atenção: A quantidade excede o limite. Você pode confirmar no máximo ${limiteAtual} pessoa(s).`);
            inputAcompanhantes.value = limiteAtual;
            return; 
        }

        // Montagem da mensagem formatada
        let mensagem = `Olá! Confirmando RSVP para o aniversário do *Daniel (1 Aninho)*:\n\n`;
        mensagem += `👤 *Nome:* ${nome}\n`;
        
        if (presenca === "Sim") {
            mensagem += `✅ *Presença:* Confirmada!\n`;
            mensagem += `👥 *Total de pessoas:* ${quantidade}\n`;
        } else {
            mensagem += `❌ *Presença:* Não poderei comparecer.\n`;
        }

        // Gera o link e abre no WhatsApp
        const url = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensagem)}`;
        window.open(url, '_blank');
    });
</script>

</body>
</html>
