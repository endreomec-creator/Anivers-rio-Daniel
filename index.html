<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de Presença - Aniversário do Daniel</title>
    <style>
        :root {
            --bg-color: #f4efe6;
            --primary-green: #3d5a32;
            --accent-green: #587947;
            --wood-brown: #5c4033;
            --card-bg: #ffffff;
            --text-color: #2c3e2e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            padding: 28px;
            box-sizing: border-box;
            border: 2px solid #e0d6c3;
        }

        .header { text-align: center; margin-bottom: 24px; }
        .header span { font-size: 0.9rem; color: var(--wood-brown); text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }
        .header h1 { color: var(--primary-green); margin: 8px 0 4px 0; font-size: 1.8rem; }
        .header p { color: var(--accent-green); margin: 0; font-weight: 600; }

        .details-box {
            background-color: #f9f6f0;
            border-left: 4px solid var(--primary-green);
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }
        .details-box p { margin: 6px 0; color: #4a4a4a; }

        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: var(--primary-green); font-size: 0.95rem; }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus { border-color: var(--primary-green); }

        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }

        .msg-limite {
            font-size: 0.85rem;
            color: var(--accent-green);
            margin-top: 6px;
            font-weight: 600;
        }

        .erro-duplicado {
            color: #d32f2f;
            background: #ffebee;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #d32f2f;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover { background-color: var(--accent-green); }
        .btn-submit:disabled { background-color: #a0a0a0; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <span>Aventuras no Bosque</span>
        <h1>Daniel - 1 Aninho</h1>
        <p>Venha comemorar conosco!</p>
    </div>

    <div class="details-box">
        <p>📅 <strong>Data:</strong> 26/09/2026</p>
        <p>🕒 <strong>Horário:</strong> 13h às 16h</p>
        <p>📍 <strong>Local:</strong> GameStation - Shopping Patteo L3</p>
    </div>

    <form id="rsvpForm">
        <div class="form-group">
            <label for="nome">Seu Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu primeiro nome" required>
        </div>

        <div id="mensagemLimite" class="msg-limite" style="display:none; margin-bottom: 15px;"></div>

        <div class="form-group">
            <label for="presenca">Você irá ao evento?</label>
            <select id="presenca" required>
                <option value="Sim">Sim, estarei lá! 🐾</option>
                <option value="Nao">Infelizmente não poderei ir</option>
            </select>
        </div>

        <div id="camposQuantidade">
            <div class="form-row">
                <div class="form-group">
                    <label for="adultos">Adultos:</label>
                    <input type="number" id="adultos" min="1" value="1" required>
                </div>
                <div class="form-group">
                    <label for="criancas">Crianças:</label>
                    <input type="number" id="criancas" min="0" value="0" required>
                </div>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="btnConfirmar">Confirmar Presença</button>
    </form>
</div>

<script>
    const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbzeLoprQjqOY8KFEiyZ6f-aq1FvvkUNfsUHWkjeqbsTUTqYoEYb9Lfl1IobmWdhBYPy/exec"; 

    let limitePermitido = 1;
    let convidadoJaRespondeu = false;

    function normalizarTextoLocal(texto) {
        return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    async function buscarRestricao() {
        const nomeInput = document.getElementById('nome').value.trim();
        const msgDiv = document.getElementById('mensagemLimite');
        const btn = document.getElementById('btnConfirmar');

        if (nomeInput.length >= 3) {
            msgDiv.style.display = "block";
            msgDiv.className = "msg-limite";
            msgDiv.innerText = "Buscando convite...";

            try {
                const res = await fetch(`${URL_WEB_APP}?nome=${encodeURIComponent(normalizarTextoLocal(nomeInput))}`);
                const data = await res.json();

                if (data.jaRespondeu) {
                    convidadoJaRespondeu = true;
                    msgDiv.className = "msg-limite erro-duplicado";
                    msgDiv.innerHTML = `⚠️ <strong>${data.mensagem}</strong>`;
                    btn.disabled = true;
                    return;
                }

                // Se não respondeu, libera o botão
                convidadoJaRespondeu = false;
                btn.disabled = false;

                if (data.encontrado) {
                    limitePermitido = data.limite;
                    msgDiv.innerHTML = `🌟 Convite localizado! Você pode confirmar até <strong>${limitePermitido} pessoa(s)</strong> no total.`;
                } else {
                    limitePermitido = 1;
                    msgDiv.innerHTML = `⚠️ Nome não localizado na lista de convites. Limite padrão: 1 pessoa.`;
                }
            } catch (err) {
                msgDiv.innerText = "Erro ao consultar a lista de convidados.";
            }
        } else {
            msgDiv.style.display = "none";
        }
    }

    document.getElementById('nome').addEventListener('blur', buscarRestricao);

    document.getElementById('presenca').addEventListener('change', function() {
        document.getElementById('camposQuantidade').style.display = this.value === "Sim" ? "block" : "none";
    });

    document.getElementById('rsvpForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const btn = document.getElementById('btnConfirmar');
        const nomeCompleto = document.getElementById('nome').value.trim();
        const presenca = document.getElementById('presenca').value;
        const adultos = parseInt(document.getElementById('adultos').value) || 0;
        const criancas = parseInt(document.getElementById('criancas').value) || 0;
        const total = adultos + criancas;

        if (convidadoJaRespondeu) {
            alert("Convite respondido, falar com Jana ou Endreo");
            return;
        }

        if (presenca === "Sim") {
            if (total > limitePermitido) {
                alert(`A quantidade total (${total}) excede o seu limite permitido de ${limitePermitido} pessoa(s).`);
                return;
            }
            if (total < 1) {
                alert("Por favor, selecione ao menos 1 adulto ou criança.");
                return;
            }
        }

        btn.disabled = true;
        btn.innerText = "Enviando...";

        try {
            await fetch(URL_WEB_APP, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    nome: nomeCompleto,
                    presenca: presenca,
                    adultos: presenca === "Sim" ? adultos : 0,
                    criancas: presenca === "Sim" ? criancas : 0
                })
            });

            alert("Confirmação processada com sucesso! Obrigado.");
            document.getElementById('rsvpForm').reset();
            document.getElementById('mensagemLimite').style.display = 'none';
        } catch (error) {
            console.error("Erro:", error);
            alert("Ocorreu um erro ao salvar sua confirmação. Tente novamente.");
        }

        btn.disabled = false;
        btn.innerText = "Confirmar Presença";
    });
</script>

</body>
</html>
