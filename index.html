<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de Presença - Aniversário do Daniel</title>
    <style>
        :root {
            --bg-color: #f4efe6;
            --primary-green: #3d5a32;
            --accent-green: #587947;
            --wood-brown: #5c4033;
            --card-bg: #ffffff;
            --text-color: #2c3e2e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            padding: 28px;
            box-sizing: border-box;
            border: 2px solid #e0d6c3;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header span {
            font-size: 0.9rem;
            color: var(--wood-brown);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .header h1 {
            color: var(--primary-green);
            margin: 8px 0 4px 0;
            font-size: 1.8rem;
        }

        .header p {
            color: var(--accent-green);
            margin: 0;
            font-weight: 600;
        }

        .details-box {
            background-color: #f9f6f0;
            border-left: 4px solid var(--primary-green);
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .details-box p {
            margin: 6px 0;
            color: #4a4a4a;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: var(--primary-green);
            font-size: 0.95rem;
        }

        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            border-color: var(--primary-green);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--accent-green);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <span>Aventuras no Bosque</span>
        <h1>Daniel - 1 Aninho</h1>
        <p>Venha comemorar conosco!</p>
    </div>

    <div class="details-box">
        <p>📅 <strong>Data:</strong> 26/09/2026</p>
        <p>🕒 <strong>Horário:</strong> 13h às 16h</p>
        <p>📍 <strong>Local:</strong> GameStation - Shopping Patteo L3</p>
    </div>

    <form id="rsvpForm">
        <div class="form-group">
            <label for="nome">Seu Nome Completo:</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>
        </div>

        <div class="form-group">
            <label for="presenca">Você irá ao evento?</label>
            <select id="presenca" required>
                <option value="Sim">Sim, estarei lá! 🐾</option>
                <option value="Nao">Infelizmente não poderei ir</option>
            </select>
        </div>

        <div class="form-group" id="groupAcompanhantes">
            <label for="acompanhantes">Quantidade de Pessoas (incluindo você):</label>
            <input type="number" id="acompanhantes" min="1" value="1" required>
        </div>

        <button type="submit" class="btn-submit">Confirmar Presença</button>
    </form>
</div>

<script>
    // Altere este número para o seu WhatsApp (DDI + DDD + número)
    const SEU_WHATSAPP = "5581999999999"; 

    document.getElementById('rsvpForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const nome = document.getElementById('nome').value;
        const presenca = document.getElementById('presenca').value;
        const quantidade = document.getElementById('acompanhantes').value;

        let mensagem = `Olá! Confirmando RSVP para o aniversário do *Daniel (1 Aninho)*:\n\n`;
        mensagem += `👤 *Nome:* ${nome}\n`;
        
        if (presenca === "Sim") {
            mensagem += `✅ *Presença:* Confirmada!\n`;
            mensagem += `👥 *Total de pessoas:* ${quantidade}\n`;
        } else {
            mensagem += `❌ *Presença:* Não poderei comparecer.\n`;
        }

        const url = `https://wa.me/${81998654686}?text=${encodeURIComponent(mensagem)}`;
        window.open(url, '_blank');
    });
</script>

</body>
</html>
